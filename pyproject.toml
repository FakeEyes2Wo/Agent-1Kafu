[project]
name = "kefu-agent"
version = "0.1.0"
description = "Minimal LangChain/LangGraph multimodal customer-service agent for competition submission."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dashscope>=1.25.21",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.115.0",
    "langchain>=1.0.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.0.0",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.0.0",
    "llama-index>=0.14.22",
    "llama-index-core>=0.14.0",
    "llama-index-embeddings-huggingface>=0.6.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pydantic-settings>=2.6.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.7.0",
    "tqdm>=4.67.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kefu_agent"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
